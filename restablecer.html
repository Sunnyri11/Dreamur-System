<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nueva contraseña · Dreamur-Detector</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="auth">
    <aside class="auth-hero">
      <img src="assets/img/raco.jpg" alt="">
      <div class="marca"><img src="assets/img/raco-face.jpg" alt="">Dreamur-Detector</div>
      <h2>Elige una nueva contraseña</h2>
      <p>Después podrás iniciar sesión con ella.</p>
      <div class="capacidades"><span class="badge info">Análisis con IA</span><span class="badge ok">Seguimiento de evolución</span><span class="badge violeta">Informes en PDF</span></div>
    </aside>
    <main class="auth-panel"><div class="auth-card">
      <div><h1>Nueva contraseña</h1><p class="sub">Escríbela dos veces para confirmarla.</p></div>
      <form id="form" class="stack" novalidate>
        <div class="field"><label for="password" class="req">Nueva contraseña</label><input class="input" id="password" type="password" required autocomplete="new-password" autofocus>
          <div class="pw-fuerza" aria-hidden="true"><i></i></div><span class="hint">8 o más caracteres, con mayúscula, minúscula y número.</span></div>
        <div class="field"><label for="repite" class="req">Repite la contraseña</label><input class="input" id="repite" type="password" required autocomplete="new-password"></div>
        <button class="btn btn-primario btn-bloque" type="submit">Guardar contraseña</button>
        <div class="auth-links"><a href="index.html">Volver a iniciar sesión</a></div>
      </form>
    </div></main>
  </div>
  <noscript><p style="padding:2rem">Dreamur-Detector necesita JavaScript para funcionar.</p></noscript>
  <script type="module" src="js/pages/restablecer.js"></script>
</body>
</html>
